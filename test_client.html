<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader Test Client</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .thumbnail {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        select, button {
            padding: 10px;
            font-size: 1em;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="" alt="Video Thumbnail" class="thumbnail">
    <div class="title">Loading...</div>

    <div class="controls">
        <select id="formats">
            <option value="">Select Format</option>
            <option value="audio">Audio Only (MP3)</option>
            <option value="video">Video (MP4)</option>
        </select>
        <button class="download">Download</button>
    </div>
</div>

<script>
    let savedResponse = null;
    const thumbnail = document.querySelector(".thumbnail");
    const titleElem = document.querySelector(".title");
    const select = document.querySelector("#formats");
    const downloadbtn = document.querySelector(".download");
    
    // Use the backend URL provided in the user request or localhost if testing locally
    // The user provided: https://yt-dlp-backend-production-9654.up.railway.app
    // But since we are working on the backend code locally, we might want to point to localhost for testing?
    // The user's snippet used the production URL. I will use the production URL as base but make it easy to switch.
    // Actually, if I am fixing the backend code *here*, I should probably point to the local backend if I want to verify *my* changes.
    // However, the user is likely running this client against the deployed backend? 
    // Wait, the user asked me to "make this to send audio only in mp3...". I modified the backend code locally.
    // So for the user to see the changes, they would need to deploy the backend or run it locally.
    // I will point to localhost:3000 for now since I am running the server locally.
    
    const BACKEND_URL = 'http://localhost:3000'; 
    // const BACKEND_URL = 'https://yt-dlp-backend-production-9654.up.railway.app'; // Uncomment for production

    const VIDEO_URL = "https://youtu.be/jADTdg-o8i0?si=IULCBpiSvrY10XqG"; // Example video

    document.addEventListener("DOMContentLoaded", () => {
        // Fetch info to populate UI
        fetch(`${BACKEND_URL}/api/info?url=${encodeURIComponent(VIDEO_URL)}`)
            .then(res => {
                console.log("Response status:", res.status);
                return res.json();
            })
            .then(data => {
                savedResponse = data;
                thumbnail.src = data.thumbnail;
                titleElem.innerText = data.title;
            })
            .catch(err => {
                console.error(err);
                titleElem.innerText = "Failed to load video info";
                alert("Failed to load video info! Make sure the backend is running.");
            });
    });

    function triggerDownload(url) {
        // We can just navigate to the URL to trigger download
        window.location.href = url;
    }

    downloadbtn.addEventListener("click", () => {
        if (!savedResponse) {
            alert("Video info not loaded yet.");
            return;
        }

        const selected = select.value;
        if (!selected) {
            alert("Please select a format.");
            return;
        }

        // Construct the download URL pointing to OUR backend
        // The backend handles the conversion/merging and returns the file stream directly.
        // We do NOT use the raw URLs from 'savedResponse.formats' because those are raw YouTube streams (often m3u8).
        
        let downloadUrl = `${BACKEND_URL}/api/download?url=${encodeURIComponent(VIDEO_URL)}`;

        if (selected === "audio") {
            downloadUrl += "&type=audio";
        } else if (selected === "video") {
            downloadUrl += "&type=video";
        }

        console.log("Triggering download from:", downloadUrl);
        triggerDownload(downloadUrl);
    });
</script>

</body>
</html>
